app.acknowledgment.content=<div class="panel panel-info"><div class="panel-heading">Tool Information</div><div class="panel-body"><p style="text-align: left">As of August 2026, the National Institute of Standards and Technology (NIST), is no longer funding the project, and ongoing support for the tools is funded by the Centers for Disease Control and Prevention (CDC) and Office of the National Coordinator (ONC) for Health Information Technology, a component of the U.S. Department of Health and Human Services. The former "NIST Tools" have been rebranded as the Standards &amp; Interoperability Testing Tools (SITT). Prometheus Computing LLC has been contracted by CDC and ONC to maintain, update, and host the HL7 v2 Immunization Integration Test Suite used for HIMSS immunization integration testing.</p></div></div><div class="panel panel-info"><div class="panel-heading">Funding Sources</div><div class="panel-body"><p style="text-align: left">The Immunization Integration Test Suite is supported by ONC through Chickasaw Nation Industries and by CDC through AIRA as part of a cooperative agreement award. Funding from Chickasaw Nation Industries and ONC is under Contract Number 47QTCA20D00BR/140D0425F0766, HHS ONC IT Support. AIRA and CDC funding is under award number NU38OT000291 under CDC-RFA-OT18-1802, Strengthening Public Health Systems and Services Through National Partnerships to Improve and Protect the Nation's Health. The content is solely the responsibility of the authors and does not necessarily represent the official views of Chickasaw Nation Industries, ONC, AIRA or CDC.</p></div></div>


name: HIMSS PR check

# The only image build + smoke. Runs on a pull request into himss.
# Does not process the zip and does not publish.

run-name: HIMSS PR check

on:
  pull_request:
    branches: [himss]
    paths:
      - 'hit-iz-resource/**'
      - 'hit-iz-domain/**'
      - 'hit-iz-repo/**'
      - 'hit-iz-service/**'
      - 'hit-iz-ws/**'
      - 'hit-iz-web/**'
      - 'docker/**'
      - 'scripts/**'
      - 'tcamt-export/resources.zip'
      - 'pom.xml'
      - '**/pom.xml'
      - '.dockerignore'
      - '.github/workflows/build-himss.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify resource bundle version bump
        run: bash scripts/verify-resource-bundle-version.sh

      - name: Check if frontend rebuild is needed
        id: frontend
        run: |
          if bash scripts/needs-frontend-build.sh; then
            echo "skip_frontend=0" >> "$GITHUB_OUTPUT"
          else
            echo "skip_frontend=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build tool image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: hit-iz-himss-hid:ci
          build-args: |
            SKIP_FRONTEND=${{ steps.frontend.outputs.skip_frontend }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: bash scripts/docker-smoke-test.sh hit-iz-himss-hid:ci 18080

      - name: Collect smoke test logs
        if: failure()
        run: docker logs smoke-app 2>&1 | tail -400 || true

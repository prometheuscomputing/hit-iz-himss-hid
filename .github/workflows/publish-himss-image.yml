name: Publish HIMSS Tool image

# Publish only when someone chooses to: a GitHub Release, or Run workflow
# with an explicit tag. Merge to himss does not publish.
# Does not process the TCAMT zip — that is process-resource-bundle.yml.

run-name: publish HIMSS image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (e.g. 1.9.15)
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/prometheuscomputing/hit-iz-himss-hid

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: Set image tags
        id: meta
        run: |
          set -euo pipefail
          rb="$(grep '^app.resourceBundleVersion=' hit-iz-web/src/main/resources/app-config.properties | cut -d= -f2 | tr -d '[:space:]')"
          sha="${GITHUB_SHA::7}"
          {
            echo "rb=${rb}"
            echo "sha=${sha}"
          } >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${{ inputs.tag }}"
          fi
          version="${tag#v}"
          echo "primary=${tag}" >> "$GITHUB_OUTPUT"
          echo "extra=${version}" >> "$GITHUB_OUTPUT"

      - name: Check if frontend rebuild is needed
        id: frontend
        run: |
          if bash scripts/needs-frontend-build.sh; then
            echo "skip_frontend=0" >> "$GITHUB_OUTPUT"
          else
            echo "skip_frontend=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            SKIP_FRONTEND=${{ steps.frontend.outputs.skip_frontend }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.primary }}
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.extra }}
            ${{ env.IMAGE_NAME }}:rb-${{ steps.meta.outputs.rb }}
            ${{ env.IMAGE_NAME }}:sha-${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE_NAME }}:himss
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: bash scripts/docker-smoke-test.sh "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.primary }}" 8080

      - name: Collect smoke test logs
        if: failure()
        run: docker logs smoke-app 2>&1 | tail -400 || true

      - name: Push image
        run: |
          set -euo pipefail
          docker push "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.primary }}"
          docker push "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.extra }}"
          docker push "${{ env.IMAGE_NAME }}:rb-${{ steps.meta.outputs.rb }}"
          docker push "${{ env.IMAGE_NAME }}:sha-${{ steps.meta.outputs.sha }}"
          docker push "${{ env.IMAGE_NAME }}:himss"
          docker tag "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.primary }}" "${{ env.IMAGE_NAME }}:latest"
          docker push "${{ env.IMAGE_NAME }}:latest"

name: HIMSS deploy branch

# Process a new TCAMT zip (if present) and build+smoke the image.
# Does not publish to GHCR — that happens when himss-deploy merges into himss.

on:
  push:
    branches: [himss-deploy]
    paths:
      - 'tcamt-export/resources.zip'
      - 'hit-iz-resource/**'
      - 'hit-iz-domain/**'
      - 'hit-iz-repo/**'
      - 'hit-iz-service/**'
      - 'hit-iz-ws/**'
      - 'hit-iz-web/**'
      - 'docker/**'
      - 'scripts/**'
      - 'pom.xml'
      - '**/pom.xml'
      - '.dockerignore'
      - '.github/workflows/himss-deploy.yml'
  workflow_dispatch:

concurrency:
  group: himss-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  process:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: himss-deploy

      - name: Detect new or changed TCAMT zip
        id: zip
        run: |
          set -euo pipefail
          ZIP="tcamt-export/resources.zip"
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -f "$ZIP" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            if [ -f "$ZIP" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if git diff --name-only "$BEFORE" "${{ github.sha }}" -- "$ZIP" | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install wkhtmltopdf
        if: steps.zip.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf

      - name: Process zip and commit
        id: sync
        if: steps.zip.outputs.changed == 'true'
        run: |
          set -euo pipefail
          bash scripts/process-tcamt-resource-bundle.sh \
            --apply \
            --bump-version \
            tcamt-export/resources.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            hit-iz-resource/src/main/resources \
            hit-iz-web/src/main/resources/app-config.properties
          if git diff --staged --quiet; then
            echo "processed=false" >> "$GITHUB_OUTPUT"
            echo "Zip produced no resource changes."
            exit 0
          fi
          VERSION="$(grep '^app.resourceBundleVersion=' hit-iz-web/src/main/resources/app-config.properties | cut -d= -f2)"
          git commit -m "chore: sync resource bundle from TCAMT export (${VERSION})"
          git push origin himss-deploy
          echo "processed=true" >> "$GITHUB_OUTPUT"

  build:
    needs: process
    if: github.actor != 'github-actions[bot]' && !cancelled() && needs.process.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: himss-deploy

      - name: Verify resource bundle version bump
        run: bash scripts/verify-resource-bundle-version.sh

      - name: Check if frontend rebuild is needed
        id: frontend
        run: |
          if bash scripts/needs-frontend-build.sh; then
            echo "skip_frontend=0" >> "$GITHUB_OUTPUT"
          else
            echo "skip_frontend=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build tool image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: hit-iz-himss-hid:ci
          build-args: |
            SKIP_FRONTEND=${{ steps.frontend.outputs.skip_frontend }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract WAR from image
        run: |
          mkdir -p hit-iz-web/target
          cid="$(docker create hit-iz-himss-hid:ci)"
          docker cp "$cid:/usr/local/tomcat/webapps/immunization-himss.war" hit-iz-web/target/immunization-himss.war
          docker rm "$cid"
          ls -lh hit-iz-web/target/immunization-himss.war

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: immunization-himss-war
          path: hit-iz-web/target/immunization-himss.war
          if-no-files-found: error

      - name: Smoke test image
        run: bash scripts/docker-smoke-test.sh hit-iz-himss-hid:ci 18080

      - name: Collect smoke test logs
        if: failure()
        run: docker logs smoke-app 2>&1 | tail -400 || true

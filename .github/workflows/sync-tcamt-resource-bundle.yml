name: Sync TCAMT resource bundle

on:
  push:
    branches: [himss]
    paths:
      - 'tcamt-export/resources.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install wkhtmltopdf
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf

      - name: Process TCAMT export zip
        run: |
          bash scripts/process-tcamt-resource-bundle.sh \
            --apply \
            --bump-version \
            tcamt-export/resources.zip

      - name: Commit synced resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            hit-iz-resource/src/main/resources \
            hit-iz-web/src/main/resources/app-config.properties
          if git diff --staged --quiet; then
            echo "No resource changes after processing."
            exit 0
          fi
          VERSION="$(grep '^app.resourceBundleVersion=' hit-iz-web/src/main/resources/app-config.properties | cut -d= -f2)"
          git commit -m "chore: sync resource bundle from TCAMT export (${VERSION})"
          git push

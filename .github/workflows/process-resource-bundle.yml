name: Process resource bundle

# Manual only. Always process tcamt-export/resources.zip on himss-deploy,
# bump app.resourceBundleVersion, and commit. Does not build or publish.

run-name: process resource bundle

on:
  workflow_dispatch:

concurrency:
  group: process-resource-bundle-himss-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: himss-deploy

      - name: Install wkhtmltopdf
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf

      - name: Process zip and commit
        run: |
          set -euo pipefail
          ZIP="tcamt-export/resources.zip"
          if [ ! -f "$ZIP" ]; then
            echo "Missing $ZIP on himss-deploy."
            exit 1
          fi
          bash scripts/process-tcamt-resource-bundle.sh \
            --apply \
            --bump-version \
            "$ZIP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            hit-iz-resource/src/main/resources \
            hit-iz-web/src/main/resources/app-config.properties
          if git diff --staged --quiet; then
            echo "Process produced no file changes."
            exit 0
          fi
          VERSION="$(grep '^app.resourceBundleVersion=' hit-iz-web/src/main/resources/app-config.properties | cut -d= -f2)"
          git commit -m "chore: sync resource bundle from TCAMT export (${VERSION})"
          git push origin himss-deploy
